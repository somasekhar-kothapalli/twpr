name: TWPR Print

# EIA prints Wednesday 10:30 New York = 20:00 IST = 14:30 UTC while US daylight saving lasts.
# Runs at 20:00 with fallbacks at 20:01 and 20:02; a later run does nothing if today's signal is already out.
# US daylight saving ends Sun 1 Nov 2026: from then the print is 15:30 UTC (21:00 IST), so move the three
# cron lines to hour 15 (back to 14 on 14 Mar 2027).
on:
  schedule:
    - cron: "30 14 * * 3"
    - cron: "31 14 * * 3"
    - cron: "32 14 * * 3"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if today's signal already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: twpr-data
  cancel-in-progress: false

jobs:
  print:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120        # eia_actuals polls up to 90 minutes for the report
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FREECURRENCYAPI_KEY: ${{ secrets.FREECURRENCYAPI_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      SIGMA_METHOD: ${{ vars.SIGMA_METHOD }}
      MCX_CRUDEOIL_LOTS: ${{ vars.MCX_CRUDEOIL_LOTS }}
      MCX_CRUDEOILM_LOTS: ${{ vars.MCX_CRUDEOILM_LOTS }}
    steps:
      - uses: actions/checkout@v4

      # signal.json is committed by the first run that succeeds; its release_date (DD-MM-YYYY) is today's if so.
      - name: Already sent today?
        id: done
        run: |
          today=$(TZ=Asia/Kolkata date +%d-%m-%Y)
          if [ "${{ inputs.force }}" != "true" ] && [ -f data/signal.json ] \
             && [ "$(python -c "import json;print(json.load(open('data/signal.json')).get('release_date'))")" = "$today" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "signal for $today already sent"
          fi

      - uses: actions/setup-python@v5
        if: steps.done.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.done.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - if: steps.done.outputs.skip != 'true'
        run: python -m playwright install --with-deps chromium

      - name: EIA actuals, signal, alert
        if: steps.done.outputs.skip != 'true'
        run: xvfb-run -a python -m app.run print

      - name: Commit data
        if: steps.done.outputs.skip != 'true' && success()
        run: |
          git config user.name  "twpr-bot"
          git config user.email "twpr-bot@users.noreply.github.com"
          for f in data/eia_actuals.json data/signal.json data/surprise_history.json; do [ -f "$f" ] && git add -f "$f"; done
          git diff --staged --quiet || git commit -m "data: EIA actuals and signal"
          git pull --rebase && git push
